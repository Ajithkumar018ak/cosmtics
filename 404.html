    color: var(--pink-dark);
}

.error-eyebrow {
    margin-bottom: 17px;
    color: var(--pink-dark);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.error-number {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    gap: clamp(4px, 1.6vw, 17px);
    perspective: 800px;

    font-family: var(--serif);
    font-size: clamp(125px, 18vw, 225px);
    font-weight: 500;
    line-height: 0.9;
    letter-spacing: -12px;
}

.error-number span {
    display: inline-block;
    color: transparent;
    background: linear-gradient(
        145deg,
        #d77f9f 0%,
        #f3c6d7 25%,
        #c85c86 55%,
        #f4b9ce 75%,
        #b34f78 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 9px 12px rgba(194, 97, 137, 0.12));
    transform-origin: center bottom;
    animation: numberEnter 1s cubic-bezier(.2, .75, .25, 1) both;
}

.error-number span:nth-child(2) {
    animation-delay: 0.12s;
}

.error-number span:nth-child(3) {
    animation-delay: 0.24s;
}

.error-number::after {
    position: absolute;
    z-index: -1;
    inset: 12px -10px -10px;
    content: "404";
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1.6vw, 17px);
    color: rgba(226, 152, 179, 0.11);
    filter: blur(15px);
}

.error-heading {
    margin-top: 29px;
    font-family: var(--serif);
    font-size: clamp(31px, 4.6vw, 54px);
    font-weight: 400;
    line-height: 1.18;
    letter-spacing: -1px;
    color: var(--dark);
}

.error-heading em {
    color: var(--pink-dark);
    font-weight: 400;
}

.error-description {
    max-width: 410px;
    margin: 18px auto 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 2;
}

/* =========================================
   BUTTONS
========================================= */

.error-actions {
    margin-top: 29px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 13px;
}

.home-button,
.back-button {
    position: relative;
    min-height: 51px;
    padding: 0 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    transition:
        color var(--ease),
        border-color var(--ease),
        background var(--ease),
        transform var(--ease),
        box-shadow var(--ease);
}

.home-button {
    border: 1px solid var(--pink-dark);
    background: var(--pink-dark);
    color: white;
    box-shadow: 0 8px 22px rgba(198, 95, 135, 0.15);
}

.home-button::before {
    position: absolute;
    inset: 0;
    content: "";
    background: var(--pink-deep);
    transform: translateX(-105%);
    transition: transform 0.4s cubic-bezier(.22, .61, .36, 1);
}

.home-button:hover::before {
    transform: translateX(0);
}

.home-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 13px 28px rgba(198, 95, 135, 0.24);
}

.home-button span,
.home-button svg {
    position: relative;
    z-index: 1;
}

.home-button svg {
    width: 15px;
    height: 15px;
    transition: transform var(--ease);
}

.home-button:hover svg {
    transform: translateX(4px);
}

.back-button {
    border: 1px solid #eed8e1;
    background: rgba(255, 255, 255, 0.72);
    color: var(--dark);
}

.back-button:hover {
    border-color: var(--pink-medium);
    background: white;
    color: var(--pink-dark);
    transform: translateY(-3px);
}

.back-button svg {
    width: 15px;
    height: 15px;
}

/* =========================================
   TINY BOTTOM LABELS
========================================= */

.content-note {
    margin-top: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #b29aa5;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.content-note-line {
    width: 25px;
    height: 1px;
    background: #e8bdcd;
}

.content-note-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--pink-medium);
}

/* =========================================
   PRODUCT FLOAT ANIMATIONS
========================================= */

@keyframes productFloat {
    0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
    }
    25% {
        transform: translate3d(12px, -20px, 35px) scale(1.07);
    }
    50% {
        transform: translate3d(-8px, -35px, 65px) scale(0.94);
    }
    75% {
        transform: translate3d(-18px, -12px, 25px) scale(1.04);
    }
}

@keyframes productRotate {
    0%, 100% {
        rotate: 0deg;
    }
    25% {
        rotate: 5deg;
    }
    50% {
        rotate: -7deg;
    }
    75% {
        rotate: 3deg;
    }
}

@keyframes lightDriftOne {
    from { transform: translate3d(0, 0, 0) scale(0.9); }
    to { transform: translate3d(100px, 60px, 0) scale(1.15); }
}

@keyframes lightDriftTwo {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(-100px, -50px, 0) scale(1.2); }
}

@keyframes orbitSpinOne {
    from { rotate: 0deg; }
    to { rotate: 360deg; }
}

@keyframes orbitSpinTwo {
    from { rotate: 360deg; }
    to { rotate: 0deg; }
}

@keyframes pearlFloat {
    0%, 100% {
        transform: translate3d(0, 0, 20px) scale(1);
    }
    50% {
        transform: translate3d(15px, -24px, 70px) scale(1.15);
    }
}

@keyframes sparklePulse {
    0%, 100% {
        opacity: 0.3;
        transform: scale(0.7) rotate(0);
    }
    50% {
        opacity: 1;
        transform: scale(1.2) rotate(45deg);
    }
}

@keyframes particleDrift {
    0% {
        transform: translate3d(0, 30px, 0) scale(0.5);
        opacity: 0;
    }
    15% {
        opacity: 0.7;
    }
    75% {
        opacity: 0.45;
    }
    100% {
        transform: translate3d(25px, -180px, 80px) scale(1.2);
        opacity: 0;
    }
}

@keyframes sealRotate {
    to { transform: rotate(360deg); }
}

@keyframes numberEnter {
    from {
        opacity: 0;
        transform: rotateX(-65deg) translateY(35px) scale(0.8);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: rotateX(0) translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes contentAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================================
   TABLET
========================================= */

@media (max-width: 900px) {
    .error-content {
        width: 94%;
    }

    .perfume-product {
        left: 5%;
    }

    .lipstick-product {
        right: 7%;
    }

    .compact-product {
        left: 1%;
    }

    .serum-product {
        right: 1%;
    }

    .cream-product {
        right: 4%;
    }

    .brush-product {
        left: 7%;
    }

    .orbit-system {
        width: 100vw;
        height: 80vh;
    }
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {
    .error-page {
        min-height: 100svh;
        overflow: hidden;
    }

    .error-content {
        width: 100%;
        padding: 25px 20px;
    }

    .error-seal {
        width: 54px;
        height: 54px;
        margin-bottom: 22px;
    }

    .seal-icon {
        width: 21px;
        height: 21px;
    }

    .error-eyebrow {
        margin-bottom: 18px;
        font-size: 8px;
        letter-spacing: 3.5px;
    }

    .error-number {
        font-size: clamp(112px, 31vw, 170px);
        letter-spacing: -8px;

    }

    .error-heading {
        margin-top: 25px;
        font-size: clamp(31px, 8vw, 43px);
        line-height: 1.2;
    }

    .error-description {
        max-width: 340px;
        margin-top: 15px;
        font-size: 11px;
        line-height: 1.9;
    }

    .error-actions {
        margin-top: 24px;
        gap: 10px;
    }

    .home-button,
    .back-button {
        min-height: 47px;
        padding: 0 17px;
        font-size: 9px;
    }

    .content-note {
        margin-top: 25px;
        gap: 8px;
        font-size: 7px;
        letter-spacing: 1.3px;
    }

    .content-note-line {
        width: 16px;
    }

    /* Keep products around the edges so the text remains readable. */

    .perfume-product {
        top: 5%;
        left: -16px;
        transform: scale(0.64);
    }

    .lipstick-product {
        top: 7%;
        right: -13px;
        transform: scale(0.65);
    }

    .cream-product {
        right: -22px;
        bottom: 8%;
        transform: scale(0.68);
    }

    .brush-product {
        bottom: 8%;
        left: -18px;
        transform: scale(0.65);
    }

    .compact-product {
        top: 39%;
        left: -30px;
        transform: scale(0.65);
    }

    .serum-product {
        top: 43%;
        right: -27px;
        transform: scale(0.65);
    }

    .pearl-one {
        top: 23%;
        left: 20%;
    }

    .pearl-two {
        right: 19%;
        bottom: 25%;
    }

    .pearl-three {
        left: 25%;
        top: 72%;
    }

    .sparkle-one {
        top: 17%;
        left: 29%;
    }

    .sparkle-two {
        right: 18%;
        top: 73%;
    }

    .sparkle-three {
        left: 20%;
        bottom: 19%;
    }

    .orbit-system {
        width: 130vw;
        height: 75vh;
    }

    .orbit-one {
        width: 95%;
        height: 34%;
    }

    .orbit-two {
        width: 78%;
        height: 56%;
    }

    .orbit-three {
        width: 62%;
        height: 68%;
    }

    .background-grid {
        background-size: 45px 45px;
    }

    .background-light {
        width: 400px;
        height: 400px;
    }
}

/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 380px) {
    .error-content {
        padding: 20px 16px;
    }

    .error-seal {
        width: 46px;
        height: 46px;
        margin-bottom: 18px;
    }

    .error-number {
        font-size: 112px;
        letter-spacing: -7px;
    }

    .error-heading {
        margin-top: 22px;
        font-size: 29px;
    }

    .error-description {
        font-size: 10px;
    }

    .error-actions {
        flex-direction: column;
        align-items: stretch;
        width: min(280px, 100%);
        margin-right: auto;
        margin-left: auto;
    }

    .home-button,
    .back-button {
        width: 100%;
    }

    .content-note {
        margin-top: 21px;
        font-size: 6px;
    }

    .perfume-product,
    .lipstick-product,
    .cream-product,
    .brush-product,
    .compact-product,
    .serum-product {
        opacity: 0.82;
    }
}

/* =========================================
   ACCESSIBILITY
========================================= */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<main class="error-page" id="errorPage">

    <!-- BACKGROUND LIGHTING -->

    <div class="background-light background-light-one"></div>
    <div class="background-light background-light-two"></div>
    <div class="background-light background-light-three"></div>
    <div class="background-grid"></div>


    <!-- ORBITS -->

    <div class="orbit-system" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>
    </div>


    <!-- =====================================
         FLYING COSMETIC PRODUCTS
    ====================================== -->

    <div class="cosmetic-world" id="cosmeticWorld" aria-hidden="true">

        <!-- PERFUME BOTTLE -->

        <div class="product perfume-product" data-depth="1.3">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="perfume">
                    <div class="perfume-bottle"></div>
                    <div class="perfume-neck"></div>
                    <div class="perfume-cap"></div>

                    <div class="perfume-label">
                        BLOOM
                        <small>EAU DE PARFUM</small>
                    </div>
                </div>
            </div>
        </div>


        <!-- LIPSTICK -->

        <div class="product lipstick-product" data-depth="1.8">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="lipstick">
                    <div class="lipstick-case"></div>
                    <div class="lipstick-base"></div>
                    <div class="lipstick-neck"></div>
                    <div class="lipstick-color"></div>
                    <div class="lipstick-shine"></div>
                </div>
            </div>
        </div>


        <!-- CREAM JAR -->

        <div class="product cream-product" data-depth="1.4">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="cream-jar">
                    <div class="cream-body"></div>
                    <div class="cream-lid"></div>

                    <div class="cream-brand">
                        BLOOM
                        <small>SKIN RITUAL</small>
                    </div>
                </div>
            </div>
        </div>


        <!-- MAKEUP BRUSH -->

        <div class="product brush-product" data-depth="1.6">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="makeup-brush">
                    <div class="brush-handle"></div>
                    <div class="brush-ferrule"></div>
                    <div class="brush-bristles"></div>
                </div>
            </div>
        </div>


        <!-- COMPACT POWDER -->

        <div class="product compact-product" data-depth="1.5">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="compact">
                    <div class="compact-bottom"></div>
                    <div class="compact-powder"></div>
                    <div class="compact-lid"></div>
                </div>
            </div>
        </div>


        <!-- SERUM BOTTLE -->

        <div class="product serum-product" data-depth="1.7">
            <div class="product-inner">
                <div class="product-glow"></div>

                <div class="serum">
                    <div class="serum-cap"></div>
                    <div class="serum-dropper"></div>
                    <div class="serum-body"></div>

                    <div class="serum-label">GLOW SERUM</div>

            </div>
        </div>


        <!-- FLOATING PEARLS -->

        <div class="floating-pearl pearl-one"></div>
        <div class="floating-pearl pearl-two"></div>
        <div class="floating-pearl pearl-three"></div>


        <!-- SPARKLES -->

        <div class="sparkle sparkle-one"></div>
        <div class="sparkle sparkle-two"></div>
        <div class="sparkle sparkle-three"></div>

    </div>


    <!-- PARTICLES -->

    <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>


    <!-- =====================================
         CENTER ERROR CONTENT
    ====================================== -->

    <section class="error-content">

        <div class="error-seal">

            <svg
                class="seal-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                aria-hidden="true"
            >
                <path d="M12 3c-1.5 3-5.5 5.4-5.5 10a5.5 5.5 0 0 0 11 0c0-4.6-4-7-5.5-10Z"/>
                <path d="M9.5 14.5c0 1.5 1 2.5 2.5 2.5"/>
            </svg>

        </div>


        <p class="error-eyebrow">
            Oops! Something went wrong
        </p>


        <h1 class="error-number" aria-label="404">
            <span>4</span>
            <span>0</span>
            <span>4</span>
        </h1>


        <h2 class="error-heading">
            Lost your way to<br>
            <em>something beautiful?</em>
        </h2>


        <p class="error-description">
            This page seems to have disappeared like your
            favourite lipstick shade. Let's bring you back
            to your beauty destination.
        </p>


        <div class="error-actions">

            <a href="index.html" class="home-button">

                <span>Back to Homepage</span>

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    aria-hidden="true"
                >
                    <path d="M5 12h14M13 5l7 7-7 7"/>
                </svg>

            </a>


            <button type="button" class="back-button" id="goBackButton">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    aria-hidden="true"
                >
                    <path d="M19 12H5M11 18l-6-6 6-6"/>
                </svg>

                <span>Go Back</span>

            </button>

        </div>


        <div class="content-note">
            <span class="content-note-line"></span>
            <span>Beauty is just one click away</span>
            <span class="content-note-dot"></span>
            <span class="content-note-line"></span>
        </div>

    </section>

</main>


<script>
/* =========================================
   COSMETICS 404 — INTERACTIVE ANIMATIONS
========================================= */

document.addEventListener("DOMContentLoaded", () => {

    const page = document.getElementById("errorPage");
    const world = document.getElementById("cosmeticWorld");
    const particles = document.getElementById("particleLayer");
    const backButton = document.getElementById("goBackButton");

    const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    /* =====================================
       1. CREATE FLOATING PARTICLES
    ===================================== */

    if (particles && !reduceMotion) {

        const particleCount = window.innerWidth < 600 ? 18 : 36;

        for (let i = 0; i < particleCount; i++) {

            const particle = document.createElement("span");

            particle.className = "particle";

            const size = Math.random() * 3 + 2;
            const duration = Math.random() * 8 + 7;
            const delay = Math.random() * -15;

            particle.style.left = Math.random() * 100 + "%";
            particle.style.top = Math.random() * 100 + "%";

            particle.style.setProperty(
                "--size",
                size + "px"
            );

            particle.style.setProperty(
                "--duration",
                duration + "s"
            );

            particle.style.setProperty(
                "--delay",
                delay + "s"
            );

            particles.appendChild(particle);
        }
    }


    /* =====================================
       2. PRODUCT MOUSE PARALLAX
    ===================================== */

    if (
        world &&
        !reduceMotion &&
        window.matchMedia("(hover: hover) and (pointer: fine)").matches
    ) {

        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        const products = world.querySelectorAll(".product");

        world.addEventListener("pointermove", (event) => {

            const x = event.clientX / window.innerWidth;
            const y = event.clientY / window.innerHeight;

            targetX = (x - 0.5) * 2;
            targetY = (y - 0.5) * 2;

        });

        world.addEventListener("pointerleave", () => {
            targetX = 0;
            targetY = 0;
        });

        function animateProducts() {

            currentX += (targetX - currentX) * 0.035;
            currentY += (targetY - currentY) * 0.035;

            products.forEach((product) => {

                const depth = Number(product.dataset.depth || 1);

                const offsetX = currentX * 12 * depth;
                const offsetY = currentY * 10 * depth;

                product.style.marginLeft = offsetX + "px";
                product.style.marginTop = offsetY + "px";

            });

            window.requestAnimationFrame(animateProducts);
        }

        animateProducts();
    }


    /* =====================================
       3. RANDOM PRODUCT ZOOM EFFECT
    ===================================== */

    if (world && !reduceMotion) {

        const products = [...world.querySelectorAll(".product")];

        products.forEach((product, index) => {

            const zoomDuration = 4500 + Math.random() * 3000;
            const zoomDelay = index * 550;

            window.setTimeout(() => {

                product.animate(
                    [
                        {
                            scale: "1",
                            opacity: "1"
                        },
                        {
                            scale: "1.12",
                            opacity: "1",
                            offset: 0.45
                        },
                        {
                            scale: "0.94",
                            opacity: "0.94",
                            offset: 0.72
                        },
                        {
                            scale: "1",
                            opacity: "1"
                        }
                    ],
                    {
                        duration: zoomDuration,
                        iterations: Infinity,
                        easing: "ease-in-out"
                    }
                );

            }, zoomDelay);

        });
    }


    /* =====================================
       4. SUBTLE 3D SCENE TILT
    ===================================== */

    if (
        page &&
        !reduceMotion &&
        window.matchMedia("(hover: hover) and (pointer: fine)").matches
    ) {

        page.addEventListener("pointermove", (event) => {

            const x = event.clientX / window.innerWidth - 0.5;
            const y = event.clientY / window.innerHeight - 0.5;

            const rotateX = y * -2;
            const rotateY = x * 2;

            if (world) {
                world.style.transform =
                    `perspective(1400px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            }

        });

        page.addEventListener("pointerleave", () => {

            if (world) {
                world.style.transform = "";
            }

        });
    }


    /* =====================================
       5. GO BACK BUTTON
    ===================================== */

    if (backButton) {

        backButton.addEventListener("click", () => {

            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }

        });
    }


    /* =====================================
       6. BUTTON CLICK FEEDBACK
    ===================================== */

    document.querySelectorAll(".home-button, .back-button").forEach((button) => {

        button.addEventListener("click", () => {

            if (reduceMotion) return;

            button.animate(
                [
                    { transform: "scale(1)" },
                    { transform: "scale(0.97)" },
                    { transform: "scale(1)" }
                ],
                {
                    duration: 220,
                    easing: "ease-out"
                }
            );

        });
    });

});
</script>

</body>
